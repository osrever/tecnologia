name: Paquete de Google Apps Script
on:
  push:
    branches: [apps-script]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node apps-script/build.mjs
      - run: node apps-script/check.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: autoevaluacion-apps-script
          path: dist/apps-script
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: instalacion-en-un-archivo
          path: dist/apps-script-un-archivo/Pegar-en-Codigo.gs.txt
          if-no-files-found: error
